<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo">
          <span class="logo-ico">⚔️</span>
          <h1 class="logo-name">HORIZON FORGE</h1>
          <p class="logo-tag">A Fantasy Auto-Battler on the Hive Blockchain</p>
        </div>

        <label class="field-lbl" for="hive-user">Hive Username</label>
        <div class="input-row">
          <span class="input-at">@</span>
          <input
            type="text"
            id="hive-user"
            placeholder="your-username"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="none"
          />
        </div>
        <span class="err-msg" id="err-msg"></span>

        <button class="btn-kc" id="btn-kc">
          <!--<span class="kc-ico">🔑</span> -->Enter with Hive Keychain
        </button>

        <div class="kc-warn" id="kc-warn">
          Hive Keychain not detected.<br />
          <a href="https://hive-keychain.com" target="_blank"
            >Install the browser extension →</a
          >
        </div>

        <div class="or-div"><span>or</span></div>

        <button class="btn-guest" id="btn-guest">Play as Guest</button>

        <div class="card-foot">
          <a href="https://hive-keychain.com" target="_blank"
            >Don't have Hive Keychain? Install it</a
          >
          <a href="https://peakd.com/register?ref=shiftrox" target="_blank"
            >New to Hive? Create a free account</a
          >
        </div>
      </div>
    </div>

    <script src="/js/index.js"></script>
  </body>
</html>
