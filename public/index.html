<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background:
          radial-gradient(ellipse at 18% 28%, rgba(70,22,170,0.28) 0%, transparent 55%),
          radial-gradient(ellipse at 82% 72%, rgba(22,50,190,0.20) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 50%, rgba(40,10,100,0.15) 0%, transparent 70%),
          #060213;
        font-family: "Exo 2", sans-serif;
        color: #fff;
        overflow-x: hidden;
      }

      /* ── Page center ── */
      .page {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* ── Login card ── */
      .card {
        position: relative;
        width: 100%;
        max-width: 395px;
        background: linear-gradient(
          160deg,
          rgba(14, 9, 34, 0.93),
          rgba(22, 12, 52, 0.89),
          rgba(10, 6, 26, 0.95)
        );
        border: 1.5px solid rgba(180, 130, 255, 0.28);
        border-radius: 22px;
        padding: 44px 40px 36px;
        backdrop-filter: blur(28px);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.72),
          0 0 80px rgba(100, 40, 200, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        animation: card-in 0.55s cubic-bezier(0.22, 0.68, 0, 1.15) both;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(200, 140, 255, 0.75),
          rgba(255, 200, 70, 0.6),
          transparent
        );
        border-radius: 22px 22px 0 0;
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ── Logo ── */
      .logo {
        text-align: center;
        margin-bottom: 34px;
      }
      .logo-ico {
        font-size: 50px;
        display: block;
        margin-bottom: 12px;
        filter: drop-shadow(0 0 24px rgba(255, 180, 30, 0.75));
        animation: ico-float 4.5s ease-in-out infinite;
      }
      @keyframes ico-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      .logo-name {
        font-family: "Cinzel", serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3.5px;
        background: linear-gradient(
          90deg,
          #ffd700,
          #ffb020,
          #ffe066,
          #c88cff,
          #7744ee,
          #4488ff,
          #ffe066,
          #ffd700
        );
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: logo-flow 7s linear infinite;
        -webkit-transform: translate3d(0, 0, 0);
        transform: translate3d(0, 0, 0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        margin-bottom: 8px;
      }
      @keyframes logo-flow {
        0% {
          background-position: 0% center;
        }
        100% {
          background-position: 300% center;
        }
      }
      .logo-tag {
        font-size: 11px;
        color: rgba(170, 148, 225, 0.62);
        font-style: italic;
        letter-spacing: 0.6px;
      }

      /* ── Field ── */
      .field-lbl {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: rgba(170, 138, 255, 0.65);
        font-weight: 700;
        margin-bottom: 8px;
      }
      .input-row {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1.5px solid rgba(140, 100, 255, 0.28);
        border-radius: 11px;
        overflow: hidden;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
        margin-bottom: 6px;
      }
      .input-row:focus-within {
        border-color: rgba(190, 138, 255, 0.65);
        box-shadow: 0 0 0 3px rgba(155, 88, 255, 0.1);
      }
      .input-at {
        padding: 0 8px 0 16px;
        font-size: 17px;
        color: rgba(155, 128, 255, 0.52);
        user-select: none;
      }
      .input-row input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        padding: 13px 16px 13px 0;
        color: rgba(225, 215, 255, 0.88);
        font-family: "Exo 2", sans-serif;
        font-size: 14px;
        font-weight: 500;
      }
      .input-row input::placeholder {
        color: rgba(138, 118, 195, 0.35);
      }

      .err-msg {
        display: block;
        font-size: 11px;
        color: #ff7777;
        min-height: 18px;
        margin-bottom: 4px;
      }

      /* ── Keychain button ── */
      .btn-kc {
        width: 100%;
        padding: 14px 22px;
        margin-top: 4px;
        background: linear-gradient(135deg, #1565e0, #0d4db8);
        border: 1.5px solid rgba(70, 130, 255, 0.48);
        border-radius: 12px;
        color: #fff;
        font-family: "Exo 2", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition: all 0.18s;
        position: relative;
        overflow: hidden;
      }
      .btn-kc:hover {
        background: linear-gradient(135deg, #2278f0, #1560d4);
        box-shadow: 0 8px 30px rgba(25, 100, 240, 0.42);
        transform: translateY(-2px);
      }
      .btn-kc:active {
        transform: translateY(0);
        box-shadow: none;
      }
      .btn-kc::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.11),
          transparent
        );
        transform: translateX(-100%);
        animation: kc-shim 3.2s ease-in-out infinite;
      }
      @keyframes kc-shim {
        0% {
          transform: translateX(-100%);
        }
        50%,
        100% {
          transform: translateX(150%);
        }
      }
      .kc-ico {
        font-size: 18px;
      }

      .kc-warn {
        display: none;
        margin-top: 10px;
        padding: 9px 14px;
        background: rgba(255, 140, 28, 0.08);
        border: 1px solid rgba(255, 140, 28, 0.22);
        border-radius: 9px;
        font-size: 10.5px;
        color: rgba(255, 178, 78, 0.82);
        text-align: center;
        line-height: 1.5;
      }
      .kc-warn.show {
        display: block;
      }
      .kc-warn a {
        color: #ffaa44;
      }

      /* ── Divider ── */
      .or-div {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0 16px;
      }
      .or-div::before,
      .or-div::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(140, 100, 225, 0.2);
      }
      .or-div span {
        font-size: 10px;
        color: rgba(138, 108, 205, 0.45);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* ── Guest button ── */
      .btn-guest {
        width: 100%;
        padding: 12px 22px;
        background: rgba(255, 255, 255, 0.03);
        border: 1.5px solid rgba(140, 108, 205, 0.22);
        border-radius: 12px;
        color: rgba(188, 168, 232, 0.64);
        font-family: "Exo 2", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s;
      }
      .btn-guest:hover {
        background: rgba(170, 128, 255, 0.1);
        border-color: rgba(170, 128, 255, 0.38);
        color: rgba(215, 195, 255, 0.88);
      }
      .guest-note {
        text-align: center;
        font-size: 10px;
        color: rgba(128, 108, 178, 0.4);
        font-style: italic;
        margin-top: 7px;
      }

      /* ── Footer ── */
      .card-foot {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid rgba(140, 100, 225, 0.13);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .card-foot a {
        font-size: 11px;
        color: rgba(130, 150, 215, 0.5);
        text-decoration: none;
        transition: color 0.15s;
      }
      .card-foot a:hover {
        color: rgba(175, 195, 255, 0.82);
        text-decoration: underline;
      }
      @media (max-width: 480px) {
        .card { padding: 32px 22px 28px; }
        .logo-name { font-size: 21px; letter-spacing: 2px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo">
          <span class="logo-ico">⚔️</span>
          <h1 class="logo-name">HORIZON FORGE</h1>
          <p class="logo-tag">A Fantasy Auto-Battler on the Hive Blockchain</p>
        </div>

        <label class="field-lbl" for="hive-user">Hive Username</label>
        <div class="input-row">
          <span class="input-at">@</span>
          <input
            type="text"
            id="hive-user"
            placeholder="your-username"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="none"
          />
        </div>
        <span class="err-msg" id="err-msg"></span>

        <button class="btn-kc" id="btn-kc">
          <span class="kc-ico">🔑</span> Enter with Hive Keychain
        </button>

        <div class="kc-warn" id="kc-warn">
          Hive Keychain not detected.<br />
          <a href="https://hive-keychain.com" target="_blank"
            >Install the browser extension →</a
          >
        </div>

        <div class="or-div"><span>or</span></div>

        <button class="btn-guest" id="btn-guest">⚔️ Play as Guest</button>
        <p class="guest-note">Guest mode: battles vs AI only, no HIVE bets.</p>

        <div class="card-foot">
          <a href="https://hive-keychain.com" target="_blank"
            >Don't have Hive Keychain? Install it →</a
          >
          <a href="https://peakd.com/register?ref=shiftrox" target="_blank"
            >New to Hive? Create a free account →</a
          >
        </div>
      </div>
    </div>

    <script>
      (function () {
        /* ── Session ────────────────────────────────── */
        function getSession() {
          try {
            return JSON.parse(sessionStorage.getItem("hf_session"));
          } catch {
            return null;
          }
        }
        if (getSession()) {
          window.location.replace("/lobby.html");
          return;
        }

        /* ── DOM ────────────────────────────────────── */
        const inputEl = document.getElementById("hive-user");
        const errEl = document.getElementById("err-msg");
        const kcWarn = document.getElementById("kc-warn");

        function setErr(m) {
          errEl.textContent = m;
        }
        function clrErr() {
          errEl.textContent = "";
        }

        /* ── Keychain login ─────────────────────────── */
        function doLogin() {
          clrErr();
          const raw = inputEl.value.trim();
          if (!raw) {
            setErr("Please enter your Hive username.");
            return;
          }
          const username = raw.toLowerCase();

          if (typeof window.hive_keychain === "undefined") {
            kcWarn.classList.add("show");
            setErr("Hive Keychain extension not found.");
            return;
          }
          kcWarn.classList.remove("show");

          const memo = `horizon-forge-login-${Date.now()}`;
          window.hive_keychain.requestSignBuffer(
            username,
            memo,
            "Posting",
            (resp) => {
              if (resp.success) {
                sessionStorage.setItem(
                  "hf_session",
                  JSON.stringify({
                    username,
                    mode: "hive",
                    ts: Date.now(),
                  }),
                );
                window.location.href = "/lobby.html";
              } else {
                setErr(resp.message || "Login cancelled or failed.");
              }
            },
          );
        }

        document.getElementById("btn-kc").addEventListener("click", doLogin);
        inputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") doLogin();
        });

        /* ── Guest login ────────────────────────────── */
        document.getElementById("btn-guest").addEventListener("click", () => {
          sessionStorage.setItem(
            "hf_session",
            JSON.stringify({
              username: "guest",
              mode: "guest",
              ts: Date.now(),
            }),
          );
          window.location.href = "/lobby.html";
        });
      })();
    </script>
  </body>
</html>
