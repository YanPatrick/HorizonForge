<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #050210;
      font-family: 'Exo 2', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #stars-cv { position: fixed; inset: 0; z-index: 0; }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      pointer-events: none;
    }
    .bg-orb.a {
      width: 620px; height: 620px;
      top: -200px; left: -220px;
      background: rgba(80, 28, 180, .14);
      animation: orb-a 14s ease-in-out infinite alternate;
    }
    .bg-orb.b {
      width: 500px; height: 500px;
      bottom: -160px; right: -180px;
      background: rgba(28, 55, 200, .12);
      animation: orb-b 11s ease-in-out infinite alternate;
    }
    .bg-orb.c {
      width: 320px; height: 320px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(180, 70, 255, .07);
      animation: orb-c 7s ease-in-out infinite;
    }
    @keyframes orb-a  { to { transform: translate(28px, 20px); } }
    @keyframes orb-b  { to { transform: translate(-24px, 16px); } }
    @keyframes orb-c  { 0%,100% { opacity:.4; transform:translate(-50%,-50%) scale(1); }
                        50%      { opacity:.9; transform:translate(-50%,-50%) scale(1.25); } }

    /* ── Page center ── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Login card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 395px;
      background: linear-gradient(160deg, rgba(14,9,34,.93), rgba(22,12,52,.89), rgba(10,6,26,.95));
      border: 1.5px solid rgba(180, 130, 255, .28);
      border-radius: 22px;
      padding: 44px 40px 36px;
      backdrop-filter: blur(28px);
      box-shadow:
        0 30px 90px rgba(0,0,0,.72),
        0 0 80px rgba(100,40,200,.1),
        inset 0 1px 0 rgba(255,255,255,.05);
      animation: card-in .55s cubic-bezier(.22,.68,0,1.15) both;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,140,255,.75), rgba(255,200,70,.6), transparent);
      border-radius: 22px 22px 0 0;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(.95); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Logo ── */
    .logo { text-align: center; margin-bottom: 34px; }
    .logo-ico {
      font-size: 50px;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 24px rgba(255, 180, 30, .75));
      animation: ico-float 4.5s ease-in-out infinite;
    }
    @keyframes ico-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .logo-name {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3.5px;
      background: linear-gradient(135deg, #ffd700 0%, #ffb020 40%, #ffe066 70%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255,165,0,.35));
      margin-bottom: 8px;
    }
    .logo-tag {
      font-size: 11px;
      color: rgba(170, 148, 225, .62);
      font-style: italic;
      letter-spacing: .6px;
    }

    /* ── Field ── */
    .field-lbl {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: rgba(170, 138, 255, .65);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.04);
      border: 1.5px solid rgba(140,100,255,.28);
      border-radius: 11px;
      overflow: hidden;
      transition: border-color .18s, box-shadow .18s;
      margin-bottom: 6px;
    }
    .input-row:focus-within {
      border-color: rgba(190,138,255,.65);
      box-shadow: 0 0 0 3px rgba(155,88,255,.1);
    }
    .input-at {
      padding: 0 8px 0 16px;
      font-size: 17px;
      color: rgba(155,128,255,.52);
      user-select: none;
    }
    .input-row input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      padding: 13px 16px 13px 0;
      color: rgba(225,215,255,.88);
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    .input-row input::placeholder { color: rgba(138,118,195,.35); }

    .err-msg {
      display: block;
      font-size: 11px;
      color: #ff7777;
      min-height: 18px;
      margin-bottom: 4px;
    }

    /* ── Keychain button ── */
    .btn-kc {
      width: 100%;
      padding: 14px 22px;
      margin-top: 4px;
      background: linear-gradient(135deg, #1565e0, #0d4db8);
      border: 1.5px solid rgba(70,130,255,.48);
      border-radius: 12px;
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: all .18s;
      position: relative;
      overflow: hidden;
    }
    .btn-kc:hover {
      background: linear-gradient(135deg, #2278f0, #1560d4);
      box-shadow: 0 8px 30px rgba(25,100,240,.42);
      transform: translateY(-2px);
    }
    .btn-kc:active { transform: translateY(0); box-shadow: none; }
    .btn-kc::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.11), transparent);
      transform: translateX(-100%);
      animation: kc-shim 3.2s ease-in-out infinite;
    }
    @keyframes kc-shim { 0%{transform:translateX(-100%)} 50%,100%{transform:translateX(150%)} }
    .kc-ico { font-size: 18px; }

    .kc-warn {
      display: none;
      margin-top: 10px;
      padding: 9px 14px;
      background: rgba(255,140,28,.08);
      border: 1px solid rgba(255,140,28,.22);
      border-radius: 9px;
      font-size: 10.5px;
      color: rgba(255,178,78,.82);
      text-align: center;
      line-height: 1.5;
    }
    .kc-warn.show { display: block; }
    .kc-warn a { color: #ffaa44; }

    /* ── Divider ── */
    .or-div {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 16px;
    }
    .or-div::before, .or-div::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(140,100,225,.2);
    }
    .or-div span {
      font-size: 10px;
      color: rgba(138,108,205,.45);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ── Guest button ── */
    .btn-guest {
      width: 100%;
      padding: 12px 22px;
      background: rgba(255,255,255,.03);
      border: 1.5px solid rgba(140,108,205,.22);
      border-radius: 12px;
      color: rgba(188,168,232,.64);
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
    }
    .btn-guest:hover {
      background: rgba(170,128,255,.1);
      border-color: rgba(170,128,255,.38);
      color: rgba(215,195,255,.88);
    }
    .guest-note {
      text-align: center;
      font-size: 10px;
      color: rgba(128,108,178,.4);
      font-style: italic;
      margin-top: 7px;
    }

    /* ── Footer ── */
    .card-foot {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(140,100,225,.13);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .card-foot a {
      font-size: 11px;
      color: rgba(130,150,215,.5);
      text-decoration: none;
      transition: color .15s;
    }
    .card-foot a:hover { color: rgba(175,195,255,.82); text-decoration: underline; }
  </style>
</head>
<body>
<canvas id="stars-cv"></canvas>
<div class="bg-orb a"></div>
<div class="bg-orb b"></div>
<div class="bg-orb c"></div>

<div class="page">
  <div class="card">

    <div class="logo">
      <span class="logo-ico">⚔️</span>
      <h1 class="logo-name">HORIZON FORGE</h1>
      <p class="logo-tag">A Fantasy Auto-Battler on the Hive Blockchain</p>
    </div>

    <label class="field-lbl" for="hive-user">Hive Username</label>
    <div class="input-row">
      <span class="input-at">@</span>
      <input type="text" id="hive-user" placeholder="your-username"
             autocomplete="off" spellcheck="false" autocapitalize="none">
    </div>
    <span class="err-msg" id="err-msg"></span>

    <button class="btn-kc" id="btn-kc">
      <span class="kc-ico">🔑</span> Enter with Hive Keychain
    </button>

    <div class="kc-warn" id="kc-warn">
      Hive Keychain not detected.<br>
      <a href="https://hive-keychain.com" target="_blank">Install the browser extension →</a>
    </div>

    <div class="or-div"><span>or</span></div>

    <button class="btn-guest" id="btn-guest">⚔️ Play as Guest</button>
    <p class="guest-note">Guest mode: battles vs AI only, no HIVE bets.</p>

    <div class="card-foot">
      <a href="https://hive-keychain.com" target="_blank">Don't have Hive Keychain? Install it →</a>
      <a href="https://peakd.com/register?ref=shiftrox" target="_blank">New to Hive? Create a free account →</a>
    </div>

  </div>
</div>

<script>
(function () {
  /* ── Stars ──────────────────────────────────── */
  const cv = document.getElementById('stars-cv');
  const cx = cv.getContext('2d');
  let stars = [];

  function rsz() { cv.width = innerWidth; cv.height = innerHeight; }
  function mkStars() {
    stars = Array.from({ length: 200 }, () => ({
      x: Math.random() * cv.width,
      y: Math.random() * cv.height,
      r: Math.random() * 1.35 + 0.2,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.007,
    }));
  }
  function draw() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      s.a = Math.max(0, Math.min(1, s.a + s.da));
      if (s.a <= 0 || s.a >= 1) s.da = -s.da;
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(255,255,255,${s.a * 0.72})`;
      cx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', () => { rsz(); mkStars(); });
  rsz(); mkStars(); draw();

  /* ── Session ────────────────────────────────── */
  function getSession() {
    try { return JSON.parse(sessionStorage.getItem('hf_session')); } catch { return null; }
  }
  if (getSession()) { window.location.replace('/lobby.html'); return; }

  /* ── DOM ────────────────────────────────────── */
  const inputEl = document.getElementById('hive-user');
  const errEl   = document.getElementById('err-msg');
  const kcWarn  = document.getElementById('kc-warn');

  function setErr(m)  { errEl.textContent = m; }
  function clrErr()   { errEl.textContent = ''; }

  /* ── Keychain login ─────────────────────────── */
  function doLogin() {
    clrErr();
    const raw = inputEl.value.trim();
    if (!raw) { setErr('Please enter your Hive username.'); return; }
    const username = raw.toLowerCase();

    if (typeof window.hive_keychain === 'undefined') {
      kcWarn.classList.add('show');
      setErr('Hive Keychain extension not found.');
      return;
    }
    kcWarn.classList.remove('show');

    const memo = `horizon-forge-login-${Date.now()}`;
    window.hive_keychain.requestSignBuffer(username, memo, 'Posting', (resp) => {
      if (resp.success) {
        sessionStorage.setItem('hf_session', JSON.stringify({
          username, mode: 'hive', ts: Date.now(),
        }));
        window.location.href = '/lobby.html';
      } else {
        setErr(resp.message || 'Login cancelled or failed.');
      }
    });
  }

  document.getElementById('btn-kc').addEventListener('click', doLogin);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  /* ── Guest login ────────────────────────────── */
  document.getElementById('btn-guest').addEventListener('click', () => {
    sessionStorage.setItem('hf_session', JSON.stringify({
      username: 'guest', mode: 'guest', ts: Date.now(),
    }));
    window.location.href = '/lobby.html';
  });
})();
</script>
</body>
</html>
